spring.application.name=calendariolaboral

# Puerto del servidor embebido Tomcat
server.port=${SERVER_PORT:8080}

# Conexion a PostgreSQL
# En Docker las variables SPRING_DATASOURCE_* las inyecta docker-compose.yml
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/calendariolaboral}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}

# Configuracion Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# URL Base de la API Festivos externa (Node.js en puerto 3000).
# En Docker se sobreescribe con http://dockerapifestivos:3000/api
api.festivos.url=${API_FESTIVOS_URL:http://localhost:3000/api}
